<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unihorario Web - GA Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>⬡ UNIHORARIO Web</h1>
        <p>Sistema Inteligente · Algoritmos Genéticos · Horarios Académicos</p>
    </header>

    <main>
        <section id="config-section">
            <h2>Configuración</h2>
            <div class="form-group">
                <label>Generaciones:</label>
                <input type="number" id="gen-count" value="100">
            </div>
            <div class="form-group">
                <label>Tamaño de Población:</label>
                <input type="number" id="pop-size" value="50">
            </div>
            <button id="start-btn">Iniciar Optimización</button>
            <button id="cancel-btn" disabled>Cancelar</button>
        </section>

        <section id="progress-section">
            <h2>Progreso</h2>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <p id="status-text">Listo para iniciar...</p>
            <p id="fitness-text">Mejor Fitness: 0</p>
        </section>

        <section id="results-section">
            <h2>Resultados (Mejor Horario)</h2>
            <div id="schedule-container"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('ServiceWorker registration successful with scope: ', reg.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
